<title>CollageNest · AppNest</title>
<style>
:root{
  --bg:#0b0b0c;--bg2:#141416;--bg3:#1c1b1f;--line:#2c2820;--text:#f3efe6;--muted:#a39d8f;
  --accent:#d4af37;--accent2:#f0d278;--onaccent:#111;--danger:#ff5d5d;--ok:#4cd28a;
  --radius:16px;--shadow:0 6px 24px rgba(0,0,0,.35);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Noto Sans Arabic","Noto Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.skip{position:absolute;inset-inline-start:-9999px;top:0;background:var(--accent);color:var(--onaccent);padding:10px 14px;z-index:999;border-radius:0 0 10px 10px}
.skip:focus{inset-inline-start:12px}
:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{flex:1;margin:0;font-size:18px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 .brand{color:var(--accent)}
.homebtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:16px}
.homebtn:active{transform:scale(.97)}
.icobtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.icobtn:active{transform:scale(.95)}

/* screens */
main{max-width:820px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom))}
.screen{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* home */
.hero{text-align:center;padding:18px 8px 10px}
.hero .logo{width:84px;height:84px;border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero h2{margin:10px 0 2px;font-size:28px;letter-spacing:.5px}
.hero h2 span{color:var(--accent)}
.hero p{margin:0;color:var(--muted)}
.hello{color:var(--accent2);font-weight:600;margin-top:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--bg2);min-height:112px;transition:transform .12s,border-color .2s}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.98)}
.tile .em{font-size:30px;line-height:1}
.tile b{font-size:17px}
.tile small{color:var(--muted);font-size:13px}
.tile.big{grid-column:1/-1;min-height:130px;border:1.5px solid var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--bg2)),var(--bg2) 70%)}
.tile.big b{font-size:20px;color:var(--accent)}
.quick{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:14px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.badge{display:block;text-align:center;margin:26px auto 6px;color:var(--muted);font-size:12px;letter-spacing:.4px}
.badge b{color:var(--accent)}

/* cards & forms */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.card h3 .num{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;background:var(--accent);color:var(--onaccent);font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:46px;padding:0 18px;border-radius:12px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--onaccent)}
.btn.big{min-height:58px;font-size:18px;width:100%;border-radius:14px}
.btn.ghost{border-color:var(--line);color:var(--text)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
label.f{display:block;margin:12px 0 6px;font-weight:600;font-size:14px}
input[type=text],input[type=number],select,textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg3);padding:0 12px}
textarea{padding:10px 12px;min-height:90px}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg3);padding:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);font-size:14px}
.seg button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg3))}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.toggle{position:relative;width:52px;height:30px;flex:none}
.toggle input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--bg3);border:1px solid var(--line);transition:.2s}
.toggle span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.toggle input:checked+span{background:color-mix(in srgb,var(--accent) 35%,var(--bg3));border-color:var(--accent)}
.toggle input:checked+span::after{background:var(--accent);inset-inline-start:25px}
.val{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums}
.note{border-inline-start:3px solid var(--accent);padding:8px 12px;background:var(--bg3);border-radius:8px;font-size:14px;color:var(--muted);margin:10px 0}
.warn{border-inline-start-color:var(--danger)}
.pickbox{display:flex;align-items:center;gap:12px;min-height:90px;padding:12px;border:1.5px dashed var(--line);border-radius:14px;background:var(--bg3);width:100%;text-align:start}
.pickbox:hover{border-color:var(--accent)}
.pickbox img,.pickbox canvas{width:72px;height:72px;object-fit:cover;border-radius:10px;flex:none}
.pickbox .em{font-size:30px;width:72px;text-align:center;flex:none}

/* lists */
.libs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lib{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--bg2);overflow:hidden;text-align:start;padding:0}
.lib.sel{border:2px solid var(--accent)}
.lib .cov{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1;background:var(--bg3)}
.lib .cov img{width:100%;height:100%;object-fit:cover;display:block}
.lib .meta{padding:8px 10px}
.lib .meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .meta small{color:var(--muted)}
.lib .ed{position:absolute;top:6px;inset-inline-end:6px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);font-size:16px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block;background:var(--bg3)}
.thumbs button{padding:0;border:0;background:none;position:relative}
.thumbs .ath img{border:2px solid transparent}
.thumbs .ath.on img{border-color:var(--accent)}
.thumbs .ath.out img{opacity:.3;filter:grayscale(1)}
.thumbs .tg{position:absolute;top:3px;inset-inline-end:3px;font-style:normal;font-size:12px;background:var(--accent);color:var(--onaccent);border-radius:8px;padding:0 5px;line-height:18px}
.thumbs .tg.sm{background:var(--bg3);color:var(--muted);font-size:10px}
.thumbs .fc{position:absolute;bottom:3px;inset-inline-start:3px;font-style:normal;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:0 4px}
.thumbs button.sel img{outline:3px solid var(--danger);outline-offset:-3px;opacity:.6}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gal .lib .cov{display:block}
.gal .lib .cov img{aspect-ratio:1}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty .em{font-size:44px;display:block;margin-bottom:6px}

/* editor */
.editor{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
.editor .top{position:relative}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:repeating-conic-gradient(var(--bg2) 0 25%,var(--bg3) 0 50%) 0 0/24px 24px;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoomctl{position:absolute;bottom:12px;inset-inline-end:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.zoomctl .icobtn{background:color-mix(in srgb,var(--bg) 80%,transparent)}
.hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:color-mix(in srgb,var(--bg) 85%,transparent);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-size:13px;color:var(--muted);pointer-events:none;white-space:nowrap;z-index:2;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.dock{border-top:1px solid var(--line);background:var(--bg2);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.dock .acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.dock .acts .btn{flex-direction:column;gap:2px;min-height:58px;padding:4px 4px;font-size:12.5px;line-height:1.15;white-space:normal;text-align:center;min-width:0}
.dock .acts .btn .i{font-size:19px;line-height:1}
.hint{transition:opacity .6s}.hint.fade{opacity:0}
.panel{max-height:42vh;overflow:auto;padding:4px 2px 8px}
.panel .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
@media (max-width:420px){.panel .grid2{grid-template-columns:1fr}}
.panel label.f{margin:8px 0 2px}

/* sheet & modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.scrim.center{align-items:center;padding:16px}
.sheet{width:100%;max-width:720px;max-height:86vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
.scrim.center .sheet{border-radius:20px;max-width:520px}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sheet .acts .btn{flex:1}
.alts{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.alts button{padding:0;border:2px solid transparent;border-radius:10px;background:var(--bg3);overflow:hidden;position:relative}
.alts button.cur{border-color:var(--accent)}
.alts canvas{width:100%;display:block}
.alts small{position:absolute;bottom:2px;inset-inline-start:4px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;padding:0 4px;border-radius:4px}
.steps{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.steps i.on{background:var(--accent);width:22px;border-radius:9px}
.guide-em{font-size:52px;text-align:center;margin:6px 0}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.themes button{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);position:relative;overflow:hidden}
.themes button.on{border-color:var(--text)}
.themes button span{position:absolute;inset:0}

/* progress & toast */
.prog{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.66);display:flex;align-items:center;justify-content:center;padding:20px}
.prog .box{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--accent);border-radius:18px;padding:20px;text-align:center}
.bar{height:10px;border-radius:99px;background:var(--bg3);overflow:hidden;margin:14px 0 8px;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .15s}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--bg3);border:1px solid var(--accent);color:var(--text);padding:12px 18px;border-radius:14px;box-shadow:var(--shadow);max-width:92vw;font-size:15px;animation:fade .2s}
.toast.err{border-color:var(--danger)}
.banner{background:color-mix(in srgb,var(--danger) 18%,var(--bg2));border:1px solid var(--danger);padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv b{color:var(--muted);font-weight:600}
pre.diag{white-space:pre-wrap;word-break:break-all;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;max-height:40vh;overflow:auto;direction:ltr;text-align:left}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.tpls button{padding:4px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg3);aspect-ratio:1}
.tpls button.on{border-color:var(--accent)}
.tpls svg{width:100%;height:100%;display:block}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatches button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line)}
.swatches button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--accent)}
.viewer img{max-width:100%;max-height:62vh;display:block;margin:0 auto;border-radius:12px;border:1px solid var(--line)}
.lang-sel{max-width:180px}
</style>

<script>
/* ═══ CollageNest · AppNest — core (storage, i18n helpers, UI shell) ═══ */
'use strict';
const APP_VERSION = '1.2.0';
const STORE_URL = 'https://appnest-store.pages.dev';
const FEEDBACK_MAIL = 'appnest55@gmail.com';

/* ── error log (first, so it catches everything) ── */
function logErr(msg, src, line) {
  try {
    const a = JSON.parse(localStorage.getItem('cn_errors') || '[]');
    a.unshift({ m: String(msg).slice(0, 300), s: src ? String(src).split('/').pop() : '', l: line || 0, t: new Date().toISOString() });
    localStorage.setItem('cn_errors', JSON.stringify(a.slice(0, 10)));
  } catch (e) {}
}
addEventListener('error', e => logErr(e.message, e.filename, e.lineno));
addEventListener('unhandledrejection', e => logErr('Promise: ' + ((e.reason && e.reason.message) || e.reason)));

/* ── storage shim: localStorage → memory ── */
const Store = (() => {
  const mem = {}; let ok = true;
  try { localStorage.setItem('cn__t', '1'); localStorage.removeItem('cn__t'); } catch (e) { ok = false; }
  return {
    ok: () => ok,
    get(k, d) { try { const v = ok ? localStorage.getItem('cn_' + k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) {
      const s = JSON.stringify(v);
      if (ok) { try { localStorage.setItem('cn_' + k, s); return true; } catch (e) { mem[k] = s; toast(T('saveFail'), true); return false; } }
      mem[k] = s; return true;
    },
    del(k) { try { ok ? localStorage.removeItem('cn_' + k) : delete mem[k]; } catch (e) {} },
    clearAll() {
      try { Object.keys(localStorage).filter(k => k.startsWith('cn_')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
      for (const k in mem) delete mem[k];
    }
  };
})();

/* ── IndexedDB: libs / tiles (Blob) / gallery (Blob) → memory fallback ── */
const DB = (() => {
  let db = null, mem = null;
  const STORES = ['libs', 'tiles', 'gallery'];
  const initMem = () => { const m = {}; STORES.forEach(s => m[s] = new Map()); return m; };
  function open() {
    return new Promise(res => {
      if (!('indexedDB' in self)) { mem = initMem(); return res(false); }
      let r;
      try { r = indexedDB.open('collagenest', 1); } catch (e) { mem = initMem(); return res(false); }
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('libs')) d.createObjectStore('libs', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('tiles')) { const s = d.createObjectStore('tiles', { keyPath: 'id' }); s.createIndex('lib', 'libId'); }
        if (!d.objectStoreNames.contains('gallery')) d.createObjectStore('gallery', { keyPath: 'id' });
      };
      r.onsuccess = () => { db = r.result; res(true); };
      r.onerror = () => { mem = initMem(); res(false); };
    });
  }
  function run(store, mode, fn) {
    return new Promise((res, rej) => {
      let t; try { t = db.transaction(store, mode); } catch (e) { return rej(e); }
      const r = fn(t.objectStore(store)); let out;
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return {
    open, isMem: () => !!mem,
    put(store, o) { if (mem) { mem[store].set(o.id, o); return Promise.resolve(); } return run(store, 'readwrite', s => s.put(o)); },
    putMany(store, arr) {
      if (mem) { arr.forEach(o => mem[store].set(o.id, o)); return Promise.resolve(); }
      return new Promise((res, rej) => {
        const t = db.transaction(store, 'readwrite'), s = t.objectStore(store);
        arr.forEach(o => s.put(o));
        t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      });
    },

async function createMosaic(reseed) {
  reseed = reseed === true && !!MS;
  const m = S.mosaic;
  if (!reseed) {
    if (!Setup.main) { toast(T('needMain'), true); return; }
    const lib = m.lib && await DB.get('libs', m.lib);
    if (!lib || !lib.count) { toast(T('needLib'), true); return; }
  }
  const p = Prog.show(T('creating'), true);
  try {
    let ms;
    if (reseed && MS) { ms = MS; }
    else {
      const cache = await LibCache.load(m.lib, p);
      if (!cache.tiles.length) throw new Error('empty');
      const a = ASPECTS[m.aspect];
      p.set(0.27, T('analyzing'));
      const tf = await tileFeatures(cache.minis, a, m.flip);
      if (p.cancelled) throw new Error('cancel');
      const g = gridFor(Setup.main.width, Setup.main.height, m.cols, a);
      p.set(0.33, T('analyzing')); await yieldUI();
      const tg = targetFeatures(Setup.main, g);
      ms = { main: Setup.main, name: Setup.mainName, libId: m.lib, tiles: cache.tiles, minis: cache.minis, cols: g.cols, rows: g.rows, a, src: g.src,
        tf: tf.feats, tileOf: tf.tileOf, flipOf: tf.flipOf, N: tf.N, cf: tg.feats, rgb: tg.rgb, variety: m.variety };
    }
    const C = ms.cols * ms.rows, vp = varietyParams(ms.variety, C, ms.N);
    const assign = await runMatch({ tf: ms.tf, tileOf: ms.tileOf, N: ms.N, cf: ms.cf, C, cols: ms.cols, maxRep: vp.maxRep, R: vp.R, seed: (Math.random() * 4e9) >>> 0 }, p);
    if (p.cancelled) throw new Error('cancel');
    ms.assign = assign; ms.undo = []; ms.redo = []; ms.saved = false;
    p.set(0.94, T('drawing')); await yieldUI();
    buildComposite(ms, m);
    MS = ms;
    p.close();
    if (reseed) { Ed.redraw(); Ed.syncUndo(); toast(T('reshuffled')); }
    else go('editor');
  } catch (e) {
    p.close();
    if (e && e.message === 'cancel') toast(T('cancelled'));
    else { logErr('createMosaic: ' + (e && e.message)); toast(T('mosaicFail'), true); }
  }
}

const Ed = {

      '<button class="btn ghost" id="edSettings" type="button"><span class="i">⚙️</span><span>' + esc(T('changeSetup')) + '</span></button></div></div>';
    ed.classList.remove('hidden');

    $('edBack').onclick = () => history.back();
    $('edUndo').onclick = () => this.undo(); $('edRedo').onclick = () => this.redoOp();
    $('zIn').onclick = () => this.zoomBy(1.6); $('zOut').onclick = () => this.zoomBy(1 / 1.6); $('zFit').onclick = () => { this.fit(); this.redraw(); };
    $('edStyle').onclick = () => this.toggleStyle();
    $('edExport').onclick = () => exportSheet();
    $('edShuffle').onclick = () => createMosaic(true);
    $('edSettings').onclick = () => go('mosaic');
    this.bindGestures();
    if (this.ro) this.ro.disconnect();
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe($('stage'));
    this.resize(true); this.syncUndo();
    $('edHint').textContent = T('edHint', { n: nf(MS.cols * MS.rows) });
    clearTimeout(this._ht); this._ht = setTimeout(() => { const h = $('edHint'); if (h) h.classList.add('fade'); }, 5000);
  },
  close() { if (this.ro) this.ro.disconnect(); this.ro = null; $('editor').classList.add('hidden'); $('editor').innerHTML = ''; this.hi.forEach(b => { try { b.close(); } catch (e) {} }); this.hi.clear(); },
  resize(first) {
    const st = $('stage'); if (!st) return;
    const r = st.getBoundingClientRect(); this.dpr = Math.min(3, devicePixelRatio || 1);
    const cx = (r.width / 2 - this.tx) / this.s, cy = (r.height / 2 - this.ty) / this.s;
    this.cv.width = Math.round(r.width * this.dpr); this.cv.height = Math.round(r.height * this.dpr); this.W = r.width; this.H = r.height;
    if (first || !this._fitS) this.fit(); else { this.tx = r.width / 2 - cx * this.s; this.ty = r.height / 2 - cy * this.s; }
    this.redraw();
  },
  fit() {
    const cw = MS.comp.width, ch = MS.comp.height, pad = 12;
    this.s = this._fitS = Math.min((this.W - pad * 2) / cw, (this.H - pad * 2) / ch);
    this.tx = (this.W - cw * this.s) / 2; this.ty = (this.H - ch * this.s) / 2;
  },
  limits() { return [this._fitS * 0.6, Math.max(this._fitS * 2, 420 / MS.ch)]; },
  zoomAt(ns, px, py) {
    const [mn, mx] = this.limits(); ns = clamp(ns, mn, mx);
    const ux = (px - this.tx) / this.s, uy = (py - this.ty) / this.s;
    this.s = ns; this.tx = px - ux * ns; this.ty = py - uy * ns; this.clampPan(); this.redraw();
  },
  zoomBy(f) { this.zoomAt(this.s * f, this.W / 2, this.H / 2); },
  clampPan() {
    const w = MS.comp.width * this.s, h = MS.comp.height * this.s, m = 60;
    this.tx = clamp(this.tx, Math.min(m - w, (this.W - w) / 2), Math.max(this.W - m, (this.W - w) / 2));
    this.ty = clamp(this.ty, Math.min(m - h, (this.H - h) / 2), Math.max(this.H - m, (this.H - h) / 2));
  },
  redraw() { if (this.raf) return; this.raf = requestAnimationFrame(() => { this.raf = 0; this.paint(); }); },
  paint() {
    const x = this.x, m = MS, st = S.mosaic; if (!x || !m) return;
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, this.cv.width, this.cv.height);
    x.setTransform(this.dpr * this.s, 0, 0, this.dpr * this.s, this.dpr * this.tx, this.dpr * this.ty);
    const cellPx = m.ch * this.s * this.dpr;
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    if (cellPx <= m.ch * 1.5) x.drawImage(m.comp, 0, 0);
    else {
      const c0 = clamp(Math.floor(-this.tx / this.s / m.cw), 0, m.cols - 1), c1 = clamp(Math.ceil((this.W - this.tx) / this.s / m.cw), 0, m.cols);
      const r0 = clamp(Math.floor(-this.ty / this.s / m.ch), 0, m.rows - 1), r1 = clamp(Math.ceil((this.H - this.ty) / this.s / m.ch), 0, m.rows);
      x.save(); x.beginPath(); x.rect(c0 * m.cw, r0 * m.ch, (c1 - c0) * m.cw, (r1 - r0) * m.ch); x.clip();
      paintBackground(x, m.comp.width, m.comp.height, st); x.restore();
      const wantHi = cellPx > 70;
      for (let cy = r0; cy < r1; cy++) for (let cx = c0; cx < c1; cx++) {
        const i = cy * m.cols + cx, t = m.tileOf[m.assign[i]];
        let b = wantHi ? this.hi.get(t) : null;
        if (wantHi && !b) this.loadHi(t);
        drawCell(x, m, i, cx * m.cw, cy * m.ch, m.cw, m.ch, b || m.minis[t], st);
      }
    }
    if (this.sel >= 0) {
      const cx = this.sel % m.cols, cy = (this.sel / m.cols) | 0;
      x.lineWidth = 3 / this.s; x.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent') || '#d4af37';
      x.strokeRect(cx * m.cw, cy * m.ch, m.cw, m.ch);
    }
  },
  loadHi(t) {
    if (this.loading.has(t)) return; this.loading.add(t);
    createImageBitmap(MS.tiles[t].blob).then(b => {
      this.loading.delete(t); this.hi.set(t, b);
      if (this.hi.size > 160) { const k = this.hi.keys().next().value; try { this.hi.get(k).close(); } catch (e) {} this.hi.delete(k); }
      this.redraw();
    }).catch(() => this.loading.delete(t));
  },
  bindGestures() {
    const el = $('stage'), P = new Map(); let g = null;
    el.addEventListener('pointerdown', e => {
      if (e.target.closest('.zoomctl')) return;
      el.setPointerCapture(e.pointerId); P.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
      if (P.size === 1) g = { k: 1, x: e.offsetX, y: e.offsetY, tx: this.tx, ty: this.ty, t: Date.now(), moved: false };
      else if (P.size === 2) { const [a, b] = [...P.values()]; g = { k: 2, d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, s: this.s, tx: this.tx, ty: this.ty, moved: true }; }
    });
    el.addEventListener('pointermove', e => {
      if (!P.has(e.pointerId) || !g) return;
      P.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
      if (g.k === 1 && P.size === 1) {
        const dx = e.offsetX - g.x, dy = e.offsetY - g.y;
        if (Math.abs(dx) + Math.abs(dy) > 7) g.moved = true;
        if (g.moved) { this.tx = g.tx + dx; this.ty = g.ty + dy; this.clampPan(); this.redraw(); }
      } else if (g.k === 2 && P.size >= 2) {
        const [a, b] = [...P.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const [mn, mxs] = this.limits(); const ns = clamp(g.s * d / g.d, mn, mxs);
        const ux = (g.mx - g.tx) / g.s, uy = (g.my - g.ty) / g.s;
        this.s = ns; this.tx = mx - ux * ns; this.ty = my - uy * ns; this.clampPan(); this.redraw();
      }
    });
    const end = e => {
      if (!P.has(e.pointerId)) return;
      P.delete(e.pointerId);
      if (g && g.k === 1 && !g.moved && Date.now() - g.t < 400 && e.type === 'pointerup') this.tap(e.offsetX, e.offsetY);
      if (P.size === 1) { const [a] = [...P.values()]; g = { k: 1, x: a.x, y: a.y, tx: this.tx, ty: this.ty, t: 0, moved: true }; }
      else if (!P.size) g = null;
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('wheel', e => { e.preventDefault(); this.zoomAt(this.s * Math.pow(1.0015, -e.deltaY), e.offsetX, e.offsetY); }, { passive: false });
  },
  tap(px, py) {
    const m = MS, ux = (px - this.tx) / this.s, uy = (py - this.ty) / this.s;
    const cx = Math.floor(ux / m.cw), cy = Math.floor(uy / m.ch);
    if (cx < 0 || cy < 0 || cx >= m.cols || cy >= m.rows) { this.sel = -1; this.redraw(); return; }
    this.sel = cy * m.cols + cx; this.redraw(); swapSheet(this.sel);
  },
  apply(i, e, rec) {
    const prev = MS.assign[i]; if (prev === e) return;
    MS.assign[i] = e; if (rec !== false) { MS.undo.push([i, prev, e]); MS.redo = []; }
    MS.saved = false; updateCompositeCell(MS, i, S.mosaic); this.redraw(); this.syncUndo();
  },
  undo() { const u = MS.undo.pop(); if (!u) return; MS.assign[u[0]] = u[1]; MS.redo.push(u); updateCompositeCell(MS, u[0], S.mosaic); this.sel = u[0]; this.redraw(); this.syncUndo(); },
  redoOp() { const u = MS.redo.pop(); if (!u) return; MS.assign[u[0]] = u[2]; MS.undo.push(u); updateCompositeCell(MS, u[0], S.mosaic); this.sel = u[0]; this.redraw(); this.syncUndo(); },
  syncUndo() { if ($('edUndo')) { $('edUndo').disabled = !MS.undo.length; $('edRedo').disabled = !MS.redo.length; $('edUndo').style.opacity = MS.undo.length ? 1 : .4; $('edRedo').style.opacity = MS.redo.length ? 1 : .4; } },
  toggleStyle() {

    p.classList.remove('hidden');
    let tmr = 0;

    const bindR = (id, k, v, suf) => { $(id).oninput = e => { st[k] = +e.target.value; $(v).textContent = st[k] + (suf || ''); rebuild(); }; };

/* swap sheet: best alternatives for one cell */

    });

  };

async function buildAuto(reseed) {
  if (!AS || !AS.chosen.length) { toast(T('needPhotos'), true); return; }
  if (reseed) AS.seed = (Math.random() * 4e9) >>> 0;
  AS.ratio = S.auto.ratio;
  const p = Prog.show(T('creatingAuto'), true);
  try {
    p.set(0.04, T('layingOut'));
    AS.L = makeLayout(AS.ps, AS.chosen, AUTO_RATIOS[AS.ratio] || 4 / 3, AS.seed);
    AS.LM = labelMap(AS.ps, AS.L);
    await yieldUI();
    const r = await renderAutoAny(AUTO_RATIOS[AS.ratio] >= 1 ? 900 : 1300, p, 0.08, 0.96);
    AS.prev = r; AS.saved = false; p.close();
    if (cur.s === 'autoEd') { AEd.paint(); toast(T('newLayout')); } else go('autoEd');
  } catch (e) {
    p.close();
    if (e && e.message === 'cancel') toast(T('cancelled')); else { logErr('auto: ' + (e && e.message)); toast(T('autoFail'), true); }
  }
}

function autoExport() {
  const ratio = AUTO_RATIOS[AS.ratio] || 4 / 3;
  const longToH = long => ratio >= 1 ? Math.round(long / ratio) : long;
  const sizes = isCoarse() ? { '1.6k': 1600, '2k': 2048, '2.4k': 2400 } : { '2k': 2048, '3k': 3072, '4k': 4096 };
  if (!sizes[S.auto.size]) S.auto.size = '2k';
  exportFlow({
    sizes, sizeKey: () => S.auto.size, setSize: k => { S.auto.size = k; },
    dims: long => { const H = longToH(long); return { W: Math.round(H * ratio), H }; },
    render: (long, p) => renderAutoAny(longToH(long), p, 0.02, 0.92).then(r => { if (S.sign && S.name) drawSignature(r.c.getContext('2d'), r.W, r.H); return r; }),
    kind: 'autocollage', name: () => T('autoTitle'),
    thumb: () => thumbOf(AS.prev.c, AS.prev.W, AS.prev.H),
    onSaved: () => { AS.saved = true; }
  });
}

/* ── router (Android back button friendly) ── */
const SCREENS = {
  home: renderHome, mosaic: renderMosaicSetup, collage: renderCollageSetup, libs: renderLibs, lib: renderLib,
  gallery: renderGallery, auto: renderAutoSetup, view: renderViewer, settings: renderSettings, about: renderAbout, guide: renderGuide, diag: renderDiag
};
let cur = { s: 'home', a: null };
function go(s, a, replace) { const st = { s, a: a == null ? null : a }; if (replace) history.replaceState(st, ''); else history.pushState(st, ''); return show(st); }
async function show(st) {
  if (!st || (!SCREENS[st.s] && st.s !== 'editor' && st.s !== 'collageEd' && st.s !== 'autoEd')) st = { s: 'home', a: null };
  if (cur.s === 'editor' && st.s !== 'editor') Ed.close();
  if (cur.s === 'collageEd' && st.s !== 'collageEd') CEd.close();
  if (cur.s === 'autoEd' && st.s !== 'autoEd') AEd.close();
  if (st.s === 'lib' && (cur.s !== 'lib' || cur.a !== st.a)) { libSel = null; libShowAll = false; }
  revokeURLs(); cur = st;
  const home = st.s === 'home';
  $('homeBtn').classList.toggle('hidden', home);
  $('title').innerHTML = home ? '<span class="brand">Collage</span>Nest' : esc(T('scr_' + st.s));
  if (st.s === 'editor') { if (!MS) return go('mosaic', null, true); Ed.open(); return; }
  if (st.s === 'collageEd') { if (!CS) return go('collage', null, true); CEd.open(); return; }
  if (st.s === 'autoEd') { if (!AS || !AS.prev) return go('auto', null, true); AEd.open(); return; }
  try { await SCREENS[st.s](st.a); } catch (e) { logErr('screen ' + st.s + ': ' + (e && e.message)); $('main').innerHTML = '<div class="empty"><span class="em">⚠️</span>' + esc(T('screenFail')) + '</div>'; }
  window.scrollTo(0, 0);
}
addEventListener('popstate', e => {
  if (modalStack.length) { modalStack[modalStack.length - 1].close(); history.pushState(cur, ''); return; }
  if (Prog.cur) { history.pushState(cur, ''); return; }
  show(e.state || { s: 'home' });
});

      '<button class="btn danger sm" id="elDel" type="button" style="margin-top:6px">🗑 ' + esc(T('deleteLib')) + '</button>',
    actions: [{ label: T('cancel'), cls: 'ghost' }, { label: T('save'), cls: 'primary', onClick: async () => { lib.name = $('elName').value.trim() || lib.name; await DB.put('libs', lib); after && after(); } }]
  });

/* ── backup / restore ── */
function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
function dataURLToBlob(u) {
  const i = u.indexOf(','), meta = u.slice(5, i), bin = atob(u.slice(i + 1)), arr = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
  return new Blob([arr], { type: meta.split(';')[0] || 'image/jpeg' });
}
async function backup(full) {
  const head = { app: 'CollageNest', v: APP_VERSION, type: full ? 'full' : 'settings', date: new Date().toISOString(), user: S.name || '', settings: Object.assign({}, S, { onboarded: true }) };
  const parts = [JSON.stringify(head).slice(0, -1)];
  if (full) {
    const libs = await DB.all('libs'), p = Prog.show(T('backingUp'), true);
    const total = libs.reduce((s, l) => s + (l.count || 0), 0) || 1; let done = 0;
    parts.push(',"libs":[');
    for (let li = 0; li < libs.length; li++) {
      if (p.cancelled) { p.close(); toast(T('cancelled')); return; }
      const tiles = await DB.byLib(libs[li].id);
      parts.push((li ? ',' : '') + '{"lib":' + JSON.stringify(libs[li]) + ',"tiles":[');
      for (let k = 0; k < tiles.length; k++) {
        const t = tiles[k];
        parts.push((k ? ',' : '') + JSON.stringify({ id: t.id, sig: t.sig, w: t.w, h: t.h, created: t.created, blob: await blobToDataURL(t.blob), mini: await blobToDataURL(t.mini) }));
        done++; if (done % 30 === 0) p.set(done / total, nf(done) + ' / ' + nf(total));
      }
      parts.push(']}');
    }
    parts.push(']');
    p.close();
  }
  parts.push('}');
  const blob = new Blob(parts, { type: 'application/json' });
  downloadBlob(blob, 'CollageNest-' + (full ? 'full' : 'settings') + '-backup-' + fileStamp() + '.json');
  toast(T('backupDone', { s: mb(blob.size) }));
}
async function restore() {
  const f = (await pickFiles('json'))[0]; if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch (e) { toast(T('restoreBad'), true); return; }
  if (!data || data.app !== 'CollageNest' || !data.settings) { toast(T('restoreBad'), true); return; }
  const full = data.type === 'full' && Array.isArray(data.libs);
  if (!await confirmBox(full ? T('restoreFullQ') : T('restoreSetQ'), T('restore'), true)) return;
  S = Object.assign({}, DEF_S, data.settings); S.mosaic = Object.assign({}, DEF_S.mosaic, S.mosaic || {}); S.collage = Object.assign({}, DEF_S.collage, S.collage || {}); S.onboarded = true; saveS();
  if (full) {
    const p = Prog.show(T('restoring'), false);
    await DB.clear('tiles'); await DB.clear('libs'); LibCache.drop(); MS = null;
    for (let li = 0; li < data.libs.length; li++) {
      const L = data.libs[li]; await DB.put('libs', L.lib);
      const recs = (L.tiles || []).map(t => ({ id: t.id, libId: L.lib.id, sig: t.sig, w: t.w, h: t.h, created: t.created, blob: dataURLToBlob(t.blob), mini: dataURLToBlob(t.mini) }));
      for (let k = 0; k < recs.length; k += 50) { await DB.putMany('tiles', recs.slice(k, k + 50)); p.set((li + k / Math.max(1, recs.length)) / data.libs.length); }
      await refreshLibCount(L.lib.id);
    }
    p.close();
  }
  applyLang(); toast(T('restored')); go('home', null, true);
}

  $('modeBtn').onclick = () => { S.mode = S.mode === 'day' ? 'night' : 'day'; saveS(); applyTheme(); };
  document.addEventListener('keydown', e => { if (e.key !== 'Escape' || Prog.cur) return; if (modalStack.length) { modalStack[modalStack.length - 1].close(); return; } if (cur.s !== 'home') history.back(); });
  await DB.open();
  const st = history.state && history.state.s ? history.state : { s: 'home', a: null };
  history.replaceState(st, '');
  await show(st);
  if (!S.onboarded) onboarding();
  registerSW();
  requestPersist();
  window.__CN_READY = true;
})();

</script>
